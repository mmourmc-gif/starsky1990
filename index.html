<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="純淨星空">
    <title>ESASky Pure Sky</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #aladin-lite-div {
            width: 100vw;
            height: 100vh;
        }

        /* 隱藏所有選單與控制項 */
        .aladin-control,
        .aladin-zoom-control,
        .aladin-layers-control,
        .aladin-goto-control,
        .aladin-share-control,
        .aladin-reticle,
        .aladin-location,
        .aladin-credit,
        .aladin-btn,
        .aladin-popup,
        .aladin-status {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="aladin-lite-div"></div>

    <script type="module">
        import A from 'https://cdn.jsdelivr.net/npm/aladin-lite@3.6.5/dist/aladin.js';

        A.init.then(() => {
            const aladin = A.aladin('#aladin-lite-div', {
                survey: 'https://skies.esac.esa.int/DSSColor',
                target: '97.01618490096757 4.869784358282433',
                fov: 7.469656588981867,
                projection: 'SIN',
                cooFrame: 'J2000',
                showReticle: false,
                showZoomControl: false,
                showFullscreenControl: false,
                showLayersControl: false,
                showGotoControl: false,
                showShareControl: false,
                showProjectionControl: false,
                showSettingsControl: false,
                showSimbadPointerControl: false,
                showCooGridControl: false,
                showStatusBar: false,
                showFrame: false,
                showCooLocation: false,
                showFov: false,
                showContextMenu: false
            });

            // 套用對比度與拉伸的函式
            function applyContrast(layer) {
                if (!layer) return;
                if (typeof layer.setOptions === 'function') {
                    layer.setOptions({ stretch: 'linear' });
                }
                if (typeof layer.setCuts === 'function') {
                    layer.setCuts(0.00000, 0.64623);
                }
            }

            // 1. 當圖層載入或變更時自動套用
            aladin.on('imageLayerChanged', function(layer) {
                applyContrast(layer);
            });

            // 2. 雙重保險：立即與延遲確認底圖已套用
            applyContrast(aladin.getBaseImageLayer());
            setTimeout(function() {
                applyContrast(aladin.getBaseImageLayer());
            }, 1000);
        });
    </script>
</body>
</html>
